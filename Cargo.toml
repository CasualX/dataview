[workspace]
members = [".", "./derive_pod"]

[package]
name = "dataview"
version = "1.0.3"
authors = ["Casper <CasualX@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

description = "Safe transmute between types and byte arrays of the same size."
documentation = "https://docs.rs/dataview/"
repository = "https://github.com/CasualX/dataview"
readme = "readme.md"
keywords = ["binary", "data", "view", "pod"]
categories = ["parser-implementations"]

[package.metadata.docs.rs]
features = ["derive_pod"]

[features]
default = ["derive_pod"]

# Kept for feature compatibility; pointer Pod impls were unsound under strict provenance.
int2ptr = []

[dependencies]
dataview_1_1 = { package = "dataview", version = "1.1.0", default-features = false }
derive_pod = { path = "./derive_pod", version = "0.1.2", optional = true }
